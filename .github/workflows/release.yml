name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/kamo62/ai-governance-orchestration

jobs:
  binaries:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ai-agent-orch
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'

      - name: Build release binaries
        run: |
          mkdir -p dist
          for target in "linux amd64" "linux arm64" "darwin amd64" "darwin arm64"; do
            set -- $target
            GOOS=$1 GOARCH=$2 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" \
              -o "dist/ai-orch_${1}_${2}" ./cmd/ai-orch
            GOOS=$1 GOARCH=$2 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" \
              -o "dist/governance-shell_${1}_${2}" ./cmd/governance-shell
          done
          (cd dist && shasum -a 256 * > SHA256SUMS)

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ai-agent-orch/dist/*
          generate_release_notes: true

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./ai-agent-orch
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
