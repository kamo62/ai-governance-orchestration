name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ai-agent-orch
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Format check
        run: |
          if [ -n "$(gofmt -l . | grep -v node_modules)" ]; then
            echo "gofmt would reformat the following files:"
            gofmt -l . | grep -v node_modules
            exit 1
          fi

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2025.1
          staticcheck ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          govulncheck ./...

      - name: Catalog validation
        run: go run ./cmd/catalog-validator -catalog-root .

  beta-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ai-agent-orch
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Compose beta smoke
        env:
          GOVERNANCE_SHELL_PORT: "18081"
        run: |
          export BIFROST_ENCRYPTION_KEY="$(openssl rand -hex 16)"
          docker compose -f docker-compose.yml -f docker-compose.beta.yml --profile beta up -d --build bifrost orchestrator governance-shell
          ./scripts/wait-readyz.sh
          docker compose -f docker-compose.yml -f docker-compose.beta.yml --profile beta run --rm beta-catalog
          docker compose -f docker-compose.yml -f docker-compose.beta.yml --profile beta run --rm --no-deps beta-smoke
          docker compose -f docker-compose.yml -f docker-compose.beta.yml --profile beta down -v --remove-orphans

  bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ai-agent-orch/agent-bridge
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Compile
        run: bun run compile
