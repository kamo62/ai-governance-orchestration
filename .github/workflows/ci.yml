name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-agent-orch

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ai-agent-orch/go.mod
          cache-dependency-path: ai-agent-orch/go.sum

      - name: Check formatting
        run: ./scripts/check-gofmt.sh

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Validate catalogue
        run: go run ./cmd/catalog-validator -catalog-root .

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
