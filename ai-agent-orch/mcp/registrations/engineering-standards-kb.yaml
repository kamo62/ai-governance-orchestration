server_id: engineering-standards-kb
category: internal-hosted
transport: http
endpoint: http://localhost:8092
auth_mode: local-dev-token
credential_scope: local
allowed_agents:
  - unit-tests
  - code-review
  - documentation
  - refactor
  - security-scan
  - architecture-review
  - security-review
  - terraform-review
  - backend-development
  - frontend-development
tool_policy:
  default_approval: auto
  allow:
    - getStandard
    - listStandards
    - searchStandards
  deny: []
data_residency: local
