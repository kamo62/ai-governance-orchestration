server_id: documentation
category: external-read-only-stub
transport: http
endpoint: http://localhost:8096
auth_mode: oauth-user
credential_scope: user-scoped-read-only-stub
allowed_agents:
  - documentation
  - code-review
  - architecture-review
  - security-review
  - terraform-review
tool_policy:
  default_approval: auto
  allow:
    - getPage
    - searchPages
    - listSections
  deny:
    - createPage
    - updatePage
    - deletePage
data_residency: local
