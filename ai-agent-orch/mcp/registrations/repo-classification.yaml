server_id: repo-classification
category: internal-hosted
transport: http
endpoint: http://localhost:8091
auth_mode: local-dev-token
credential_scope: local
allowed_agents:
  - router-agent
  - governance-lead
  - unit-tests
  - code-review
  - documentation
  - refactor
  - security-scan
  - architecture-review
  - security-review
  - terraform-review
  - backend-development
  - frontend-development
tool_policy:
  default_approval: auto
  allow:
    - getRepoClassification
    - getRepoOwner
    - listClassifiedRepos
  deny: []
data_residency: local
