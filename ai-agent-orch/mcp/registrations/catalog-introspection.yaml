server_id: catalog-introspection
category: internal-hosted
transport: http
endpoint: http://localhost:8093
auth_mode: local-dev-token
credential_scope: local
allowed_agents:
  - router-agent
  - governance-lead
tool_policy:
  default_approval: auto
  allow:
    - listSpecialists
    - getSpecialistMetadata
    - validateAgentRef
  deny: []
data_residency: local
