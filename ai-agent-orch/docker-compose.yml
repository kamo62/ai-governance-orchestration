name: ai-agent-orch

x-app-environment: &app-environment
  AI_ORCH_ADDR: :8080
  AI_ORCH_CATALOG_ROOT: /app
  AI_ORCH_AUDIT_PATH: /app/var/audit/audit.db
  AI_ORCH_SERVICE_TOKEN: ${AI_ORCH_SERVICE_TOKEN:-local-service-token}

x-mcp-environment: &mcp-environment
  AI_ORCH_MCP_TOKEN: ${AI_ORCH_MCP_TOKEN:-local-dev-token}

x-catalog-volumes: &catalog-volumes
  - ./agents:/app/agents:ro
  - ./models:/app/models:ro
  - ./mcp:/app/mcp:ro
  - ./policies:/app/policies:ro

x-runtime-volumes: &runtime-volumes
  - ./agents:/app/agents:ro
  - ./models:/app/models:ro
  - ./mcp:/app/mcp:ro
  - ./policies:/app/policies:ro
  - audit-data:/app/var/audit

services:
  bifrost:
    image: maximhq/bifrost:v1.5.7
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      BIFROST_ENCRYPTION_KEY: ${BIFROST_ENCRYPTION_KEY:?set BIFROST_ENCRYPTION_KEY in .env, e.g. openssl rand -hex 16}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    volumes:
      - bifrost-data:/app/data
      - ./bifrost/config.json:/app/data/config.json:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  governance-shell:
    build:
      context: .
    command: ["governance-shell"]
    environment:
      <<: *app-environment
      AI_ORCH_DEV_TOKEN: ${AI_ORCH_DEV_TOKEN:-local-dev}
      AI_ORCH_ADMIN_TOKEN: ${AI_ORCH_ADMIN_TOKEN:-local-admin}
      AI_ORCH_MCP_TOKEN: ${AI_ORCH_MCP_TOKEN:-local-dev-token}
      AI_ORCH_RUNTIME_TOKEN: ${AI_ORCH_RUNTIME_TOKEN:-local-runtime-token}
      AI_ORCH_GATEWAY_ADDR: ${AI_ORCH_GATEWAY_ADDR:-:18082}
      AI_ORCH_CLASSIFICATION_MAX: ${AI_ORCH_CLASSIFICATION_MAX:-internal}
      AI_ORCH_KILL_SWITCH: ${AI_ORCH_KILL_SWITCH:-false}
      AI_ORCH_COST_CAP_ENABLED: ${AI_ORCH_COST_CAP_ENABLED:-false}
      AI_ORCH_SESSION_COST_CAP_USD: ${AI_ORCH_SESSION_COST_CAP_USD:-0}
      AI_ORCH_POLICY_ENGINE: ${AI_ORCH_POLICY_ENGINE:-native}
      AI_ORCH_CONSECUTIVE_TOOL_CALL_MAX: ${AI_ORCH_CONSECUTIVE_TOOL_CALL_MAX:-15}
      AI_ORCH_REQUIRE_WORK_ITEM: ${AI_ORCH_REQUIRE_WORK_ITEM:-false}
      AI_ORCH_ENABLE_SERVER_CONTEXT_RESOLVER: ${AI_ORCH_ENABLE_SERVER_CONTEXT_RESOLVER:-false}
      AI_ORCH_GATEWAY_AUTO_SESSION: ${AI_ORCH_GATEWAY_AUTO_SESSION:-true}
      AI_ORCH_TRUSTED_CLIENT_TOKEN: ${AI_ORCH_TRUSTED_CLIENT_TOKEN:-}
      AI_ORCH_ENV: ${AI_ORCH_ENV:-local}
      AI_ORCH_ORCHESTRATOR_URL: http://orchestrator:8080
      AI_ORCH_MODEL_BACKEND: ${AI_ORCH_MODEL_BACKEND:-bifrost}
      AI_ORCH_BIFROST_BASE_URL: ${AI_ORCH_BIFROST_BASE_URL:-http://bifrost:8080}
      AI_ORCH_BIFROST_API_KEY: ${AI_ORCH_BIFROST_API_KEY:-}
      AI_ORCH_COPILOT_TOKEN_DB: ${AI_ORCH_COPILOT_TOKEN_DB:-/app/var/audit/copilot-tokens.db}
      AI_ORCH_COPILOT_TOKEN_ENCRYPTION_KEY: ${AI_ORCH_COPILOT_TOKEN_ENCRYPTION_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_APP_TITLE: ${OPENROUTER_APP_TITLE:-ai-agent-orch-local}
    depends_on:
      orchestrator:
        condition: service_healthy
    ports:
      - "127.0.0.1:${GOVERNANCE_SHELL_PORT:-18080}:8080"
      - "127.0.0.1:${MODEL_GATEWAY_PORT:-18082}:18082"
    volumes: *runtime-volumes
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 3

  orchestrator:
    build:
      context: .
    command: ["orchestrator"]
    environment:
      <<: *app-environment
      AI_ORCH_MODEL_PROXY_URL: http://governance-shell:8080/internal/v1/model
      AI_ORCH_MCP_PROXY_URL: http://governance-shell:8080/internal/v1/mcp
      AI_ORCH_MODEL_ALIAS_OVERRIDE: ${AI_ORCH_MODEL_ALIAS_OVERRIDE:-}
      AI_ORCH_OPENROUTER_REASONING_EXCLUDE: ${AI_ORCH_OPENROUTER_REASONING_EXCLUDE:-true}
    volumes: *runtime-volumes
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 3

  catalog-validator:
    profiles: ["tools"]
    build:
      context: .
    command: ["catalog-validator", "-catalog-root", "/app"]
    environment:
      <<: *app-environment
    volumes: *catalog-volumes

  openrouter-smoke:
    profiles: ["tools"]
    build:
      context: .
    command:
      - ai-orch
      - smoke
      - openrouter
      - -catalog-root
      - /app
      - -model-alias
      - ${OPENROUTER_MODEL_ALIAS:-smoke-deepseek-v4-flash}
    environment:
      <<: *app-environment
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_APP_TITLE: ${OPENROUTER_APP_TITLE:-ai-agent-orch-local}
    volumes: *catalog-volumes

  opencode-sandbox:
    profiles: ["opencode"]
    image: ghcr.io/anomalyco/opencode:${OPENCODE_IMAGE_TAG:-latest}
    working_dir: /workspace
    entrypoint: ["opencode"]
    command:
      - run
      - --dir
      - /workspace
      - --model
      - ${OPENCODE_MODEL:-ai-orch/coding-balanced}
      - --agent
      - ${OPENCODE_AGENT:-governance-lead}
      - ${OPENCODE_PROMPT:-Review this sandbox workspace briefly without editing files.}
    environment:
      OPENCODE_CONFIG: /opencode/opencode.json
      AI_ORCH_RUNTIME_TOKEN: ${AI_ORCH_RUNTIME_TOKEN:-local-runtime-token}
      AI_ORCH_SESSION_ID: ${AI_ORCH_SESSION_ID:-}
      AI_ORCH_SESSION_TOKEN: ${AI_ORCH_SESSION_TOKEN:-}
      AI_ORCH_ACTOR_SUBJECT: ${AI_ORCH_ACTOR_SUBJECT:-local-dev}
      AI_ORCH_INTENT: ${AI_ORCH_INTENT:-Docker sandbox model-only review}
    depends_on:
      governance-shell:
        condition: service_healthy
    volumes:
      - ./opencode/sandbox/opencode.json:/opencode/opencode.json:ro
      - ./cmd/ai-orch/assets/opencode-ai-orch-context.ts:/opencode/ai-orch-context.ts:ro
      - opencode-sandbox-workspace:/workspace

  mcp-repo-classification:
    build:
      context: .
    command: ["mcp-stub", "repo-classification"]
    environment:
      <<: *mcp-environment
    ports:
      - "127.0.0.1:8091:8091"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8091/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  mcp-engineering-standards-kb:
    build:
      context: .
    command: ["mcp-stub", "engineering-standards-kb"]
    environment:
      <<: *mcp-environment
    ports:
      - "127.0.0.1:8092:8092"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8092/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  mcp-catalog-introspection:
    build:
      context: .
    command: ["mcp-stub", "catalog-introspection"]
    environment:
      <<: *mcp-environment
    ports:
      - "127.0.0.1:8093:8093"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8093/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  mcp-playwright-cli:
    build:
      context: .
    command: ["mcp-stub", "playwright-cli"]
    environment:
      <<: *mcp-environment
    ports:
      - "127.0.0.1:8094:8094"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8094/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  mcp-issue-tracker:
    profiles: ["phase2"]
    build:
      context: .
    command: ["mcp-stub", "issue-tracker"]
    environment:
      <<: *mcp-environment
    ports:
      - "127.0.0.1:8095:8095"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8095/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  mcp-documentation:
    profiles: ["phase2"]
    build:
      context: .
    command: ["mcp-stub", "documentation"]
    environment:
      <<: *mcp-environment
    ports:
      - "127.0.0.1:8096:8096"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8096/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  mcp-test-management:
    profiles: ["phase2"]
    build:
      context: .
    command: ["mcp-stub", "test-management"]
    environment:
      <<: *mcp-environment
    ports:
      - "127.0.0.1:8097:8097"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8097/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  ai-orch:
    profiles: ["tools"]
    build:
      context: .
    command: ["ai-orch", "smoke"]
    environment:
      AI_ORCH_GOVERNANCE_URL: http://governance-shell:8080
      AI_ORCH_ORCHESTRATOR_URL: http://orchestrator:8080
      AI_ORCH_DEV_TOKEN: ${AI_ORCH_DEV_TOKEN:-local-dev}
    depends_on:
      governance-shell:
        condition: service_healthy
      orchestrator:
        condition: service_healthy

volumes:
  bifrost-data:
  audit-data:
  opencode-sandbox-workspace:
