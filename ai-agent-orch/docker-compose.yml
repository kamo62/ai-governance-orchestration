name: ai-agent-orch

x-app-environment: &app-environment
  AI_ORCH_ADDR: :8080
  AI_ORCH_CATALOG_ROOT: /app
  AI_ORCH_AUDIT_PATH: /app/var/audit/audit.db
  AI_ORCH_SERVICE_TOKEN: ${AI_ORCH_SERVICE_TOKEN:-local-service-token}

x-mcp-environment: &mcp-environment
  AI_ORCH_MCP_TOKEN: ${AI_ORCH_MCP_TOKEN:-local-dev-token}

x-catalog-volumes: &catalog-volumes
  - ./agents:/app/agents:ro
  - ./models:/app/models:ro

x-runtime-volumes: &runtime-volumes
  - ./agents:/app/agents:ro
  - ./models:/app/models:ro
  - audit-data:/app/var/audit

services:
  governance-shell:
    build:
      context: .
    command: ["governance-shell"]
    environment:
      <<: *app-environment
      AI_ORCH_DEV_TOKEN: ${AI_ORCH_DEV_TOKEN:-local-dev}
      AI_ORCH_MCP_TOKEN: ${AI_ORCH_MCP_TOKEN:-local-dev-token}
      AI_ORCH_CLASSIFICATION_MAX: ${AI_ORCH_CLASSIFICATION_MAX:-internal}
      AI_ORCH_KILL_SWITCH: ${AI_ORCH_KILL_SWITCH:-false}
      AI_ORCH_COST_CAP_ENABLED: ${AI_ORCH_COST_CAP_ENABLED:-false}
      AI_ORCH_SESSION_COST_CAP_USD: ${AI_ORCH_SESSION_COST_CAP_USD:-0}
      AI_ORCH_POLICY_ENGINE: ${AI_ORCH_POLICY_ENGINE:-native}
      AI_ORCH_CONSECUTIVE_TOOL_CALL_MAX: ${AI_ORCH_CONSECUTIVE_TOOL_CALL_MAX:-15}
      AI_ORCH_ORCHESTRATOR_URL: http://orchestrator:8080
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_APP_TITLE: ${OPENROUTER_APP_TITLE:-ai-agent-orch-local}
    depends_on:
      orchestrator:
        condition: service_healthy
    ports:
      - "${GOVERNANCE_SHELL_PORT:-8080}:8080"
    volumes: *runtime-volumes
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 3

  orchestrator:
    build:
      context: .
    command: ["orchestrator"]
    environment:
      <<: *app-environment
      AI_ORCH_MODEL_PROXY_URL: http://governance-shell:8080/internal/v1/model
      AI_ORCH_MCP_PROXY_URL: http://governance-shell:8080/internal/v1/mcp
      AI_ORCH_MODEL_ALIAS_OVERRIDE: ${AI_ORCH_MODEL_ALIAS_OVERRIDE:-}
      AI_ORCH_OPENROUTER_REASONING_EFFORT: ${AI_ORCH_OPENROUTER_REASONING_EFFORT:-}
      AI_ORCH_OPENROUTER_REASONING_EXCLUDE: ${AI_ORCH_OPENROUTER_REASONING_EXCLUDE:-true}
    volumes: *runtime-volumes
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 3

  catalog-validator:
    profiles: ["tools"]
    build:
      context: .
    command: ["catalog-validator", "-catalog-root", "/app"]
    environment:
      <<: *app-environment
    volumes: *catalog-volumes

  openrouter-smoke:
    profiles: ["tools"]
    build:
      context: .
    command:
      - openrouter-smoke
      - -catalog-root
      - /app
      - -model-alias
      - ${OPENROUTER_MODEL_ALIAS:-smoke-deepseek-v4-flash}
    environment:
      <<: *app-environment
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_APP_TITLE: ${OPENROUTER_APP_TITLE:-ai-agent-orch-local}
    volumes: *catalog-volumes

  mcp-repo-classification:
    build:
      context: .
    command: ["mcp-repo-classification"]
    environment:
      <<: *mcp-environment
    ports:
      - "127.0.0.1:8091:8091"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8091/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  mcp-engineering-standards-kb:
    build:
      context: .
    command: ["mcp-engineering-standards-kb"]
    environment:
      <<: *mcp-environment
    ports:
      - "127.0.0.1:8092:8092"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8092/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  mcp-catalog-introspection:
    build:
      context: .
    command: ["mcp-catalog-introspection"]
    environment:
      <<: *mcp-environment
    ports:
      - "127.0.0.1:8093:8093"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8093/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  mcp-playwright-cli:
    build:
      context: .
    command: ["mcp-playwright-cli"]
    environment:
      <<: *mcp-environment
    ports:
      - "127.0.0.1:8094:8094"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8094/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  mcp-issue-tracker:
    profiles: ["phase2"]
    build:
      context: .
    command: ["mcp-issue-tracker"]
    environment:
      <<: *mcp-environment
    ports:
      - "127.0.0.1:8095:8095"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8095/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  mcp-documentation:
    profiles: ["phase2"]
    build:
      context: .
    command: ["mcp-documentation"]
    environment:
      <<: *mcp-environment
    ports:
      - "127.0.0.1:8096:8096"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8096/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  mcp-test-management:
    profiles: ["phase2"]
    build:
      context: .
    command: ["mcp-test-management"]
    environment:
      <<: *mcp-environment
    ports:
      - "127.0.0.1:8097:8097"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8097/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  ai-orch:
    profiles: ["tools"]
    build:
      context: .
    command: ["ai-orch", "smoke"]
    environment:
      AI_ORCH_GOVERNANCE_URL: http://governance-shell:8080
      AI_ORCH_ORCHESTRATOR_URL: http://orchestrator:8080
      AI_ORCH_DEV_TOKEN: ${AI_ORCH_DEV_TOKEN:-local-dev}
    depends_on:
      governance-shell:
        condition: service_healthy
      orchestrator:
        condition: service_healthy

volumes:
  audit-data:
