name: ai-agent-orch

services:
  bifrost:
    profiles: ["bifrost"]

  governance-shell:
    environment:
      AI_ORCH_MODEL_BACKEND: native-openrouter
      AI_ORCH_BIFROST_BASE_URL: ""
      AI_ORCH_AGENTGATEWAY_BASE_URL: ""
      AI_ORCH_AGENTGATEWAY_READINESS_URL: ""
    depends_on:
      orchestrator:
        condition: service_healthy
