name: documentation
version: 0.1.0
phase: experimental
owner: local
runtime: opencode
model:
  primary: coding-economy
  fallback: router-small
mcp_servers:
  - repo-classification
  - engineering-standards-kb
tools_allowed:
  - read_file
  - write_file
permissions:
  network: deny
  workspace_write: allow
  outside_workspace_write: deny
governance:
  classification_max: internal
cost:
  per_invocation_cap_usd: 0.10
  consecutive_tool_call_max: 15
evals:
  path: ./evals/
  required_for_phase0: false
