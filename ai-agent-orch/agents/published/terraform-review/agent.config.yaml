name: terraform-review
version: 1.0.0
phase: published
owner: local
runtime: opencode
model:
  primary: coding-primary
  fallback: coding-balanced
mcp_servers:
  - repo-classification
  - engineering-standards-kb
  - issue-tracker
  - documentation
  - test-management
tools_allowed:
  - read_file
permissions:
  network: deny
  workspace_write: deny
  outside_workspace_write: deny
governance:
  classification_max: internal
cost:
  per_invocation_cap_usd: 0.30
evals:
  path: ./evals/
  required_for_phase0: true
