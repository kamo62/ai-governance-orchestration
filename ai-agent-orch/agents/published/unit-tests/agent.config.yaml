name: unit-tests
version: 1.0.0
phase: published
owner: local
runtime: opencode
model:
  primary: coding-fast
  fallback: coding-economy
mcp_servers:
  - repo-classification
  - engineering-standards-kb
  - playwright-cli
tools_allowed:
  - read_file
  - write_file
  - run_command:playwright
permissions:
  network: deny
  workspace_write: allow
  outside_workspace_write: deny
governance:
  classification_max: internal
cost:
  per_invocation_cap_usd: 0.25
  consecutive_tool_call_max: 15
evals:
  path: ./evals/
  required_for_phase0: true
