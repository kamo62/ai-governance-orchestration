# yaml-language-server: $schema=https://agentgateway.dev/schema/config
#
# Local agentgateway provider-plumbing candidate for ai-orch.
# Runtimes still call ai-orch. ai-orch calls agentgateway. agentgateway calls
# OpenRouter through an OpenAI-compatible upstream.
config:
  adminAddr: 0.0.0.0:15000
  statsAddr: 0.0.0.0:15020
  readinessAddr: 0.0.0.0:15021

binds:
  - port: 3000
    listeners:
      - name: ai-orch-openrouter
        protocol: HTTP
        routes:
          - name: ai-orch-openrouter
            backends:
              - ai:
                  name: openrouter
                  hostOverride: openrouter.ai:443
                  pathPrefix: /api/v1
                  provider:
                    openAI: {}
                  policies:
                    backendTLS: {}
                    ai:
                      routes:
                        /v1/chat/completions: completions
                        /v1/responses: responses
                        "*": passthrough
