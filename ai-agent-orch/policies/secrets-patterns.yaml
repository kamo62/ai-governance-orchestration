# Secrets patterns used by the Governance Shell scanner.
# These are compiled into regexes at startup.

patterns:
  - name: openrouter_api_key
    regex: '(?i)\b(?:OPENROUTER_API_KEY\s*=\s*)?sk-or-v1-[A-Za-z0-9_-]{10,}'
    severity: critical

  - name: openai_api_key
    regex: '\bsk-[A-Za-z0-9]{20,}'
    severity: critical

  - name: aws_access_key_id
    regex: '\bAKIA[0-9A-Z]{16}\b'
    severity: critical

  - name: aws_secret_access_key
    regex: '\b[A-Za-z0-9/+=]{40}\b'
    severity: critical
    context: requires aws_access_key_id in same prompt

  - name: private_key
    regex: '-----BEGIN [A-Z ]*PRIVATE KEY-----'
    severity: critical

  - name: password_assignment
    regex: '(?i)\b(password|passwd|pwd)\s*[:=]\s*[^[:space:]]{8,}'
    severity: high

  - name: github_token
    regex: '(?i)\bgh[pousr]_[A-Za-z0-9_]{36,}\b'
    severity: critical

  - name: jwt_token
    regex: '\beyJ[A-Za-z0-9_-]*\.eyJ[A-Za-z0-9_-]*\.[A-Za-z0-9_-]*\b'
    severity: high
