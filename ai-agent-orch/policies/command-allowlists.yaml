# Command allowlist defines which commands agents may execute.
# The default is deny-all; agents must explicitly list allowed commands.

system_commands:
  - name: read_file
    description: Read file contents from the workspace.
    default: allow

  - name: write_file
    description: Write or overwrite file contents in the workspace.
    default: deny
    requires: workspace_write = allow

  - name: run_command
    description: Execute a shell command.
    default: deny
    subcommands:
      - name: playwright
        description: Run Playwright tests.
        allowed_agents:
          - test-generation
      - name: go
        description: Run Go commands (test, build, fmt).
        allowed_agents:
          - test-generation
          - code-review
      - name: bun
        description: Run Bun scripts (test, lint, typecheck).
        allowed_agents:
          - test-generation
          - code-review
      - name: npm
        description: Run npm scripts.
        allowed_agents:
          - test-generation
    # Deny by default: curl, wget, aws, kubectl, terraform, docker, etc.
